name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # No Gradle wrapper is committed, so the distribution is installed by the
      # action and invoked directly. Loom 1.18 requires Gradle 9.7 or newer.
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build mod jar
        run: gradle build --stacktrace

      # Guards against a jar that compiles but cannot load. A client-side
      # fabric.mod.json ships from processClientResources, not processResources,
      # so an unconfigured build produces a jar with raw ${version} in it.
      - name: Verify jar contents
        run: |
          set -euo pipefail
          JAR=$(ls -1 build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Built: $JAR"
          test -f "$JAR"

          MOD_JSON=$(unzip -p "$JAR" fabric.mod.json)
          echo "$MOD_JSON"

          if echo "$MOD_JSON" | grep -q '\${'; then
            echo "::error::fabric.mod.json contains unsubstituted placeholders"
            exit 1
          fi

          echo "$MOD_JSON" | grep -q '"minecraft": "~26.3"' \
            || { echo "::error::wrong Minecraft version in fabric.mod.json"; exit 1; }

          echo "--- shader assets ---"
          unzip -l "$JAR" | grep -E '\.(frag|glsl|vert)$'

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: onigiri-mc26.3
          path: build/libs/*.jar
          if-no-files-found: error

      # Releases are cut manually rather than on every push. Each push already
      # produces a downloadable artifact above; turning that into a release for
      # every commit would bury the actual downloads in noise.
      - name: Attach to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          draft: true
          generate_release_notes: true

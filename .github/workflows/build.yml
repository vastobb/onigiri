name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # No Gradle wrapper is committed, so the distribution is installed by the
      # action and invoked directly. Loom 1.18 requires Gradle 9.7 or newer.
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      # Minecraft compiles its own shaders at runtime, so a GLSL error would
      # otherwise only show up as a black screen on a player's machine.
      - name: Validate GLSL shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 tools/validate_shaders.py

      - name: Build mod jar
        run: gradle build --stacktrace

      # Guards against a jar that compiles but cannot load. A client-side
      # fabric.mod.json ships from processClientResources, not processResources,
      # so an unconfigured build produces a jar with raw ${version} in it.
      - name: Verify jar contents
        run: |
          set -euo pipefail
          JAR=$(ls -1 build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Built: $JAR"
          test -f "$JAR"

          MOD_JSON=$(unzip -p "$JAR" fabric.mod.json)
          echo "$MOD_JSON"

          if echo "$MOD_JSON" | grep -q '\${'; then
            echo "::error::fabric.mod.json contains unsubstituted placeholders"
            exit 1
          fi

          echo "$MOD_JSON" | grep -q '"minecraft": "~26.3"' \
            || { echo "::error::wrong Minecraft version in fabric.mod.json"; exit 1; }

          echo "--- shader assets ---"
          unzip -l "$JAR" | grep -E '\.(frag|glsl|vert)$'

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: onigiri-mc26.3
          path: build/libs/*.jar
          if-no-files-found: error

      # Releases are not cut on every push: each push already produces a
      # downloadable artifact above, and a release per commit would bury the
      # actual downloads in noise.
      #
      # A v* tag publishes a real release. A manual dispatch makes a draft, for
      # when you want a build to look at without it being the advertised one.
      #
      # tag_name must be explicit; without an existing release the action has
      # nothing to infer a tag from and fails.
      #
      # The jar is resolved explicitly rather than with a negation glob: the
      # action's `files` input ignores the `!` pattern, and shipping the sources
      # jar next to the mod invites players to install the wrong file.
      - name: Resolve mod jar
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: modjar
        run: |
          JAR=$(ls -1 build/libs/*.jar | grep -v -- '-sources' | head -1)
          test -n "$JAR" || { echo "::error::no mod jar found"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: ${{ steps.modjar.outputs.path }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true

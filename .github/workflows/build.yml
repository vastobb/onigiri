name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # No Gradle wrapper is committed, so the distribution is installed by the
      # action and invoked directly. Loom 1.18 requires Gradle 9.7 or newer.
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
          cache-provider: basic

      - name: Build mod jar
        run: gradle build --stacktrace

      - name: Verify jar contents
        run: |
          set -euo pipefail
          JAR=$(ls -1 build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Built: $JAR"
          test -f "$JAR"

          echo "--- fabric.mod.json ---"
          unzip -p "$JAR" fabric.mod.json

          echo "--- shader assets ---"
          unzip -l "$JAR" | grep -E '\.(frag|glsl|vert)$'

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: onigiri-mc26.3
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          draft: true
          generate_release_notes: true

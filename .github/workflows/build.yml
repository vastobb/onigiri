name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # Read-only by default. The publish job below is the only thing that needs
    # write access, and a job-level `contents: write` here would hand it to every
    # pull request run as well.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # No Gradle wrapper is committed, so the distribution is installed by the
      # action and invoked directly. Loom 1.18 requires Gradle 9.7 or newer.
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      # Minecraft compiles the mod's shaders at runtime, and the target is an
      # Android GLES driver, so a GLSL error would otherwise only appear as a
      # black screen on somebody's phone. Validated as ES 3.00 - the dialect
      # MobileGlues actually runs.
      - name: Validate GLSL shaders (ES 3.00)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 tools/validate_shaders.py

      - name: Build mod jar
        run: gradle build --stacktrace

      # Guards against a jar that compiles but cannot load. A client-side
      # fabric.mod.json ships from processClientResources, not processResources,
      # so an unconfigured build produces a jar with raw ${version} in it.
      - name: Verify jar contents
        run: |
          set -euo pipefail
          JAR=$(ls -1 build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Built: $JAR"
          test -f "$JAR"

          MOD_JSON=$(unzip -p "$JAR" fabric.mod.json)
          echo "$MOD_JSON"

          if echo "$MOD_JSON" | grep -q '\${'; then
            echo "::error::fabric.mod.json contains unsubstituted placeholders"
            exit 1
          fi

          # Read the expected value from gradle.properties rather than hardcoding
          # it, so bumping the Minecraft version does not fail this check.
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "Expecting minecraft ~${MC_VERSION}"

          echo "$MOD_JSON" | grep -q "\"minecraft\": \"~${MC_VERSION}\"" \
            || { echo "::error::wrong Minecraft version in fabric.mod.json"; exit 1; }

          echo "--- shader assets ---"
          unzip -l "$JAR" | grep -E '\.(frag|glsl)$'

          # Guards the Android target: a desktop-profile shader or a GL 4.x call
          # compiles fine on the CI runner and fails on a GLES driver.
          if unzip -p "$JAR" assets/onigiri/shaders/common.glsl | grep -qE '#version +[0-9]+ +core'; then
            echo "::error::desktop-profile GLSL found; the mod targets GLES 3.00"
            exit 1
          fi

          echo "--- GL version guard (no desktop-GL-only symbols in the jar) ---"
          unzip -l "$JAR" | grep -E '\.class$' > /dev/null

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: onigiri-mc26.3
          path: build/libs/*.jar
          if-no-files-found: error

  # Releases are not cut on every push: each push already produces a downloadable
  # artifact above, and a release per commit would bury the real downloads in
  # noise. A v* tag publishes a real release; a manual dispatch makes a draft.
  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: onigiri-mc26.3
          path: jars

      # The jar is resolved explicitly rather than with a negation glob: the
      # action's `files` input ignores the `!` pattern, and shipping the sources
      # jar next to the mod invites players to install the wrong file.
      - name: Resolve mod jar
        id: modjar
        run: |
          JAR=$(ls -1 jars/*.jar | grep -v -- '-sources' | head -1)
          test -n "$JAR" || { echo "::error::no mod jar found"; exit 1; }
          echo "Publishing $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          files: ${{ steps.modjar.outputs.path }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
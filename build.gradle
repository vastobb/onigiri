plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"onigiri" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			client()
			ideConfigGenerated true
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Loom's splitEnvironmentSourceSets() creates a separate `client` source set,
// which gets its own processClientResources task. Without configuring both, the
// client-side fabric.mod.json ships with unsubstituted ${version} placeholders
// and the mod fails to load.
tasks.matching { it.name == "processResources" || it.name == "processClientResources" }.configureEach {
	def propMap = [
			"version"          : project.version,
			"minecraft_version": project.minecraft_version,
			"loader_version"   : project.loader_version
	]

	inputs.properties propMap

	filesMatching("fabric.mod.json") {
		expand propMap
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	// Full diagnostics. Without this, javac reports "no suitable method found"
	// without listing the candidates, which makes a six-error build slow to fix.
	it.options.compilerArgs << "-Xdiags:verbose"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
